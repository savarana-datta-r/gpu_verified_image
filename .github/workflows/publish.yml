# Build, scan and publish the verified-login image to GHCR.
name: publish

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "entrypoint.sh", "gpu-gate", ".github/workflows/publish.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell scripts parse
        run: |
          sh -n gpu-gate
          sh -n entrypoint.sh
          bash -n install.sh
          bash -n uninstall.sh

      - name: Build timestamp
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load locally for the scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            DOCS_REF=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4

      - name: Scan (reports HIGH/CRITICAL; does not block)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
        continue-on-error: true

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            DOCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:latest
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:${{ github.sha }}
