# Build, scan and publish the verified-login image to GHCR.
name: publish

on:
  push:
    branches: [main, image_otp]
    paths: ["Dockerfile", "Dockerfile.ml", "entrypoint.sh", "gpu-gate", "motd", "issue", ".github/workflows/publish.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tag suffix per branch, so the two images never overwrite each other.
      #   main                   -> the plain image: cuda12.4, latest, …
      #   image_otp / image_gate -> the gated image: the same names, suffixed
      #
      # The gated branch publishes under BOTH -otp and -gate. -otp is the
      # historical name, kept so nothing pointing at it breaks; -gate is what
      # the image actually is, since the gate records a login and asks for no
      # one-time password. Once every consumer reads -gate, the -otp half of
      # this can go.
      - name: Tag suffix
        id: tag
        run: |
          case "${GITHUB_REF_NAME}" in
            image_otp|image_gate)
              echo "suffix=-otp" >> "$GITHUB_OUTPUT"
              echo "alias=-gate" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "suffix=" >> "$GITHUB_OUTPUT"
              echo "alias=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Shell scripts parse
        run: |
          [ -f gpu-gate ] && sh -n gpu-gate || echo "no gate on this branch"
          sh -n entrypoint.sh
          [ -f render-motd.sh ] && sh -n render-motd.sh
          [ -f install.sh ] && bash -n install.sh
          [ -f uninstall.sh ] && bash -n uninstall.sh
          true

      - name: Build timestamp
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load locally for the scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            DOCS_REF=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4${{ steps.tag.outputs.suffix }}

      - name: Scan (reports HIGH/CRITICAL; does not block)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4${{ steps.tag.outputs.suffix }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
        continue-on-error: true

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            DOCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4${{ steps.tag.outputs.suffix }}
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:latest${{ steps.tag.outputs.suffix }}
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:${{ github.sha }}${{ steps.tag.outputs.suffix }}

      # Published by retagging rather than inside the tags: block above, so
      # that block stays plain YAML with no conditional expression in it.
      - name: Publish the -gate alias
        if: steps.tag.outputs.alias != ''
        run: |
          set -eu
          owner=${{ github.repository_owner }}
          img=ghcr.io/$owner/gpu-verified-image
          docker buildx imagetools create \
            --tag $img:cuda12.4${{ steps.tag.outputs.alias }} \
            --tag $img:latest${{ steps.tag.outputs.alias }} \
            $img:${{ github.sha }}${{ steps.tag.outputs.suffix }}

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag suffix
        id: tag
        run: |
          case "${GITHUB_REF_NAME}" in
            image_otp|image_gate)
              echo "suffix=-otp" >> "$GITHUB_OUTPUT"
              echo "alias=-gate" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "suffix=" >> "$GITHUB_OUTPUT"
              echo "alias=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # The ML image lands around 15-20 GB and a runner has roughly 14 GB free
      # on the root disk, where Docker keeps its layers. These four directories
      # are preinstalled toolchains this build never touches.
      - name: Reclaim runner disk
        run: |
          echo "before: $(df -h / | awk 'NR==2{print $4}') free"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:  $(df -h / | awk 'NR==2{print $4}') free"

      - name: Build timestamp
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed straight from the build: loading a 20 GB image locally first
      # would need the disk twice over.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ml
          push: true
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            DOCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4-ml${{ steps.tag.outputs.suffix }}
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:ml${{ steps.tag.outputs.suffix }}

      - name: Publish the -gate alias
        if: steps.tag.outputs.alias != ''
        run: |
          set -eu
          owner=${{ github.repository_owner }}
          img=ghcr.io/$owner/gpu-verified-image
          docker buildx imagetools create \
            --tag $img:cuda12.4-ml${{ steps.tag.outputs.alias }} \
            --tag $img:ml${{ steps.tag.outputs.alias }} \
            $img:ml${{ steps.tag.outputs.suffix }}
