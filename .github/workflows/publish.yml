# Build, scan and publish the verified-login image to GHCR.
name: publish

on:
  push:
    branches: [main, image_otp]
    paths: ["Dockerfile", "Dockerfile.ml", "entrypoint.sh", "gpu-gate", "motd", "issue", ".github/workflows/publish.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tag suffix per branch, so the two images never overwrite each other.
      #   main                   -> the plain image: cuda12.4, latest, …
      #   image_otp / image_gate -> the gated image: the same names, suffixed
      #
      # The gated branch publishes under BOTH -otp and -gate. -otp is the
      # historical name, kept so nothing pointing at it breaks; -gate is what
      # the image actually is, since the gate records a login and asks for no
      # one-time password. Once every consumer reads -gate, the -otp half of
      # this can go.
      - name: Tag suffix
        id: tag
        run: |
          case "${GITHUB_REF_NAME}" in
            image_otp|image_gate)
              echo "suffix=-otp" >> "$GITHUB_OUTPUT"
              echo "alias=-gate" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "suffix=" >> "$GITHUB_OUTPUT"
              echo "alias=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Shell scripts parse
        run: |
          [ -f gpu-gate ] && sh -n gpu-gate || echo "no gate on this branch"
          sh -n entrypoint.sh
          [ -f render-motd.sh ] && sh -n render-motd.sh
          [ -f install.sh ] && bash -n install.sh
          [ -f uninstall.sh ] && bash -n uninstall.sh
          true

      - name: Build timestamp
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load locally for the scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            DOCS_REF=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4${{ steps.tag.outputs.suffix }}

      - name: Scan (reports HIGH/CRITICAL; does not block)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4${{ steps.tag.outputs.suffix }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
        continue-on-error: true

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            DOCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4${{ steps.tag.outputs.suffix }}
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:latest${{ steps.tag.outputs.suffix }}
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:${{ github.sha }}${{ steps.tag.outputs.suffix }}

      # Published by retagging rather than inside the tags: block above, so
      # that block stays plain YAML with no conditional expression in it.
      - name: Publish the -gate alias
        if: steps.tag.outputs.alias != ''
        run: |
          set -eu
          owner=${{ github.repository_owner }}
          img=ghcr.io/$owner/gpu-verified-image
          docker buildx imagetools create \
            --tag $img:cuda12.4${{ steps.tag.outputs.alias }} \
            --tag $img:latest${{ steps.tag.outputs.alias }} \
            $img:${{ github.sha }}${{ steps.tag.outputs.suffix }}

      # No SSH host keys in the published image. openssh-server's postinst
      # writes a set at build time, and a baked set means every container from
      # this image answers with the same host identity while the private half
      # ships to anyone who can pull it. The Dockerfile removes them and the
      # entrypoint generates a fresh set per container; this is what stops that
      # pairing from quietly coming apart again.
      - name: The image ships no host keys
        run: |
          set -eu
          ref=ghcr.io/${{ github.repository_owner }}/gpu-verified-image:${{ github.sha }}${{ steps.tag.outputs.suffix }}
          docker pull -q "$ref"
          found=$(docker run --rm --entrypoint sh "$ref" -c 'ls /etc/ssh/ssh_host_* 2>/dev/null || true')
          if [ -n "$found" ]; then
            echo "FAIL: the image carries SSH host keys:"; echo "$found"; exit 1
          fi
          echo "ok  no host keys in the image"

          # And the entrypoint must produce a set, or sshd cannot start.
          # Start sshd the way Vast and RunPod do - directly, with the image's
          # entrypoint bypassed - because that is the path that broke: no keys,
          # no generator, "sshd: no hostkeys available -- exiting", and a
          # container that looks healthy with nothing listening.
          cid=$(docker run -d --entrypoint /usr/sbin/sshd "$ref" -D -e)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            made=$(docker exec "$cid" sh -c 'ls /etc/ssh/ssh_host_*_key 2>/dev/null | wc -l' || echo 0)
            [ "$made" -ge 1 ] && break
            sleep 1
          done
          [ "$made" -ge 1 ] || { echo "FAIL: sshd started with no host keys"; docker logs "$cid"; exit 1; }
          docker exec "$cid" sh -c 'pgrep -x sshd >/dev/null' \
            || { echo "FAIL: sshd is not running"; docker logs "$cid"; exit 1; }
          echo "ok  sshd generates $made host key(s) when started directly"

      # Pull what was just published and compare the files inside it with the
      # files in this commit. A build can succeed while shipping something
      # other than what was committed - a stale cached layer, a bad COPY path,
      # a tag pushed from the wrong ref - and nothing downstream would notice
      # until a machine behaved oddly. That happened: a published image kept
      # an old gate for a day after the source changed.
      - name: Published image matches this commit
        run: |
          set -eu
          ref=ghcr.io/${{ github.repository_owner }}/gpu-verified-image:${{ github.sha }}${{ steps.tag.outputs.suffix }}
          docker pull -q "$ref"
          cid=$(docker create "$ref")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for pair in \
            "entrypoint.sh:/usr/local/sbin/gpu-entrypoint" \
            "render-motd.sh:/etc/blackbox/render-motd.sh"; do
            src=${pair%%:*}; dst=${pair#*:}
            [ -f "$src" ] || continue
            docker cp "$cid:$dst" ./in-image \
              || { echo "FAIL: $dst is missing from the image"; exit 1; }
            if ! cmp -s "$src" ./in-image; then
              echo "FAIL: $dst in the image differs from $src in this commit"
              diff -u "$src" ./in-image | head -40
              exit 1
            fi
            echo "ok  $dst matches $src"
            rm -f ./in-image
          done

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag suffix
        id: tag
        run: |
          case "${GITHUB_REF_NAME}" in
            image_otp|image_gate)
              echo "suffix=-otp" >> "$GITHUB_OUTPUT"
              echo "alias=-gate" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "suffix=" >> "$GITHUB_OUTPUT"
              echo "alias=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # The ML image lands around 15-20 GB and a runner has roughly 14 GB free
      # on the root disk, where Docker keeps its layers. These four directories
      # are preinstalled toolchains this build never touches.
      - name: Reclaim runner disk
        run: |
          echo "before: $(df -h / | awk 'NR==2{print $4}') free"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:  $(df -h / | awk 'NR==2{print $4}') free"

      - name: Build timestamp
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed straight from the build: loading a 20 GB image locally first
      # would need the disk twice over.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ml
          push: true
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            DOCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4-ml${{ steps.tag.outputs.suffix }}
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:ml${{ steps.tag.outputs.suffix }}

      - name: Publish the -gate alias
        if: steps.tag.outputs.alias != ''
        run: |
          set -eu
          owner=${{ github.repository_owner }}
          img=ghcr.io/$owner/gpu-verified-image
          docker buildx imagetools create \
            --tag $img:cuda12.4-ml${{ steps.tag.outputs.alias }} \
            --tag $img:ml${{ steps.tag.outputs.alias }} \
            $img:ml${{ steps.tag.outputs.suffix }}
